name: Food eval battery

# THE BEHAVIOUR GATE THE UNIT SUITE CANNOT BE. The suite proves the code does
# what it says; this drives real turns through the real interpreter and proves
# the LANE still decides the same way — ask vs log, which item, whose numbers.
# Every regression this project has shipped to users was green in pytest.
#
# Not on every push: it costs paid API calls and ~10 minutes. It runs where the
# decision actually matters — a change to the food lane, a release check, and
# nightly so a drift in the model itself is caught without anyone asking.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
  pull_request:
    branches: [main]
    paths:
      - "core/food_*.py"
      - "core/prompts/**"
      - "skills/nutrition/**"
      - "handlers/tool_executor.py"
      - "scripts/eval_food_matrix.py"

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  battery:
    runs-on: ubuntu-latest
    # Serial by construction inside the script; the budget is for the whole
    # 22-case x 3-rep run plus model latency.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # WITHOUT THE KEY EVERY CASE FAILS AUTH AND THE RUN READS AS A REAL
      # REGRESSION. That false 6/20 has cost this project a debugging session
      # before, so the job stops with a clear message instead of scoring one.
      - name: Require the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "${ANTHROPIC_API_KEY:-}" || {
            echo "::error::ANTHROPIC_API_KEY secret is not set — the battery would score a false failure"
            exit 1; }

      - name: Run the battery
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Three reps, serial. Concurrency flips cases in BOTH directions via
          # the turn budget, so a parallel run is not the same measurement.
          EVAL_REPS: "3"
          PROACTIVE_MESSAGING_ENABLED: "false"
        run: python scripts/eval_food_matrix.py
