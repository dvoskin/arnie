name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run proves nothing about the tip. Cancel it rather than paying
# for it — but never cancel on main, where each commit's status is the record
# a deploy is checked against.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # A REAL POSTGRES, because one thing cannot be tested without it. The suite
    # runs on sqlite behind a StaticPool, where two sessions share a single
    # connection — so every "concurrent" test is really testing async
    # interleaving, and the cross-process guarantee (the unique index actually
    # rejecting a second claim from a second connection) has never been
    # exercised anywhere. That guarantee is the whole basis for saying a retry
    # cannot log a meal twice; it deserves better than an argument.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match production (Render runs 3.14) so CI catches version-specific issues.
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile (catch syntax/indentation errors before runtime)
        run: python -m compileall -q api bot core db handlers memory scheduler wearables skills main.py

      # ONE HEAD, ALWAYS. Several sessions work this repo in parallel and
      # each can add a migration; two heads is not a merge conflict git shows
      # you, it is a deploy that fails in Render's release phase after the
      # build succeeded. Cheap to check, expensive to discover.
      #
      # The NEW migration then compiles against POSTGRES without executing.
      # Deliberately the head alone, not the whole chain: the full replay needs
      # a live inspector (a self-healing migration calls sa.inspect) and cannot
      # run offline. Offline mode is also where the last migration bug lived —
      # op.execute() returns None there, so an unguarded rowcount print crashed
      # the Postgres compile while every local SQLite test passed.
      - name: Alembic — one head, and it compiles offline against Postgres
        run: |
          set -euo pipefail
          range="$(DATABASE_URL='sqlite:///:memory:' python scripts/migration_range.py)"
          echo "compiling $range"
          DATABASE_URL='postgresql://ci:ci@localhost/ci' \
            python -m alembic upgrade "$range" --sql > /dev/null

      - name: Run tests
        env:
          LINKING_ENABLED: "true"
          PROACTIVE_MESSAGING_ENABLED: "false"
          # Unlocks the concurrency tests that need two genuine connections.
          # Absent locally, where those tests SKIP with a reason rather than
          # passing quietly and implying a guarantee nobody checked.
          TEST_POSTGRES_URL: "postgresql+psycopg://ci:ci@localhost:5432/ci"
        # The seed is echoed by pytest-randomly on every run. Order is shuffled
        # deliberately — it is what surfaces the cross-test cache leaks that
        # made behaviour depend on which test ran first — so a red run must
        # stay reproducible: re-run with --randomly-seed=<the printed seed>.
        # `tee` + PIPESTATUS so the step still fails on a red suite while the
        # output survives for the annotation step below.
        run: |
          set -o pipefail
          python -m pytest -q --tb=line -rf 2>&1 | tee /tmp/pytest.log

      # FAILURES AS ANNOTATIONS, not just log lines.
      #
      # Job logs require a token even on a public repository, so a red CI was
      # diagnosable only by someone who could open the Actions UI. Annotations
      # ARE readable through the public check-runs API, so emitting the failing
      # test names here turns "CI is red and I cannot see why" into a question
      # anyone — or any tool — can answer.
      #
      # Cheap, and it pays for itself the first time a failure does not
      # reproduce locally, which is exactly the case that stalls a release.
      - name: Surface test failures as annotations
        if: failure()
        run: |
          if [ -f /tmp/pytest.log ]; then
            grep -aE "^(FAILED|ERROR) " /tmp/pytest.log | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            # The SEED is printed at the top by pytest-randomly and is the
            # only thing that makes a shuffled failure reproducible — a red run
            # without it is a fact you cannot act on. Grabbed separately from
            # the summary because they sit at opposite ends of the output.
            grep -am1 -E "randomly-seed" /tmp/pytest.log \
              | while IFS= read -r line; do echo "::error::$line"; done
            grep -aE "^[0-9]+ (passed|failed)|[0-9]+ failed" /tmp/pytest.log | tail -1 \
              | while IFS= read -r line; do echo "::error::summary: $line"; done
          else
            echo "::error::pytest produced no log — the step failed before running"
          fi
