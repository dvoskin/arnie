# ─────────────────────────────────────────────────────────────────────────────
# REFERENCE / INTENDED INFRA — NOT auto-applied.
# arnie-bot is configured MANUALLY in the Render dashboard (not Blueprint-managed),
# so Render does not read this file. It documents the intended setup:
#   - DATABASE_URL points at the Render-managed Postgres `arnie-db` (cutover done
#     manually; old SQLite file kept on the disk as a fallback).
#   - `alembic upgrade heads` (plural) must run on schema changes — set as the
#     dashboard Pre-Deploy Command (paid instances) or run once in the service Shell.
#     Using `heads` (not `head`) tolerates multiple unmerged branches and never
#     fails with "Multiple head revisions" if migrations diverge temporarily.
#   - The /data disk stays for per-user memory files (ARNIE_USERS_DIR=/data/users).
# If this service is ever switched to Blueprint management, this spec becomes live —
# verify the DB `plan` id against the dashboard first.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: arnie-landing
    runtime: static
    staticPublishPath: ./landing
    buildCommand: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: arnie-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    # preDeployCommand runs AFTER build and BEFORE the new instance serves traffic —
    # the correct place for migrations. `alembic upgrade heads` (plural) brings ALL
    # migration heads to their latest revision — safe with one head, immune to the
    # "Multiple head revisions" error if branches ever diverge again. A no-op once
    # up to date; does not run on every restart and won't race instances.
    preDeployCommand: alembic upgrade heads
    startCommand: python main.py
    # Disk stays: per-user memory/profile files live at /data/users (ARNIE_USERS_DIR),
    # which is NOT in Postgres. The DB itself is now Render-managed Postgres below.
    disk:
      name: arnie-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Postgres (Render-managed). fromDatabase injects the managed DB's connection
      # string; the app + Alembic coerce its libpq postgres:// form to psycopg3.
      - key: DATABASE_URL
        fromDatabase:
          name: arnie-db
          property: connectionString
      # Turn coordinator (core/turns): OBSERVE stage — runs safe stages and
      # records what it would do; legacy executes. Promoted to new_execute
      # separately, after the resolver rollout (staged per #23's plan).
      - key: TURN_COORDINATOR_MODE
        value: new_observe
      # Deep observation ON (audit B2, 2026-07-28). Without it `deep_observing()`
      # is false, the planning stages never run in observe mode, and `agree_disp`
      # short-circuits to True on every food turn — so the observe line reports
      # a LANE agreement rate under a disposition-agreement name, and the number
      # gating promotion has never measured whether the native lane would decide
      # the same thing.
      #
      # Costs a second interpreter pass on food turns, which is why it is opt-in
      # and why this is a BOUNDED window: turn it off once the disposition
      # agreement rate is established. Read-only either way — the observation
      # stages never execute tools, write rows or send messages.
      #
      # Reference-only file: set this in the Render dashboard for it to apply.
      - key: TURN_COORDINATOR_OBSERVE_DEEP
        value: "true"
      # Nutrition resolver LIVE for ALL users (Danny 2026-07-25): empty
      # allowlist = everyone. Owns only which candidate's nutrients commit;
      # micros carried, unresolved/no-calorie never promotes, crash falls to
      # legacy. Shadow comparison keeps logging in live mode (the record of
      # what changed); 2.5x calorie moves log LOUD, never blocked.
      - key: NUTRITION_RESOLVER_MODE
        value: live
      # Food composer ON (Danny 2026-07-26: "flip food composer on"). It
      # phrases an APPROVED plan — it cannot choose what to say, only how — and
      # every output clears the same `validate()` the deterministic fallback
      # satisfies, twice, before shipping. A model failure, a validation
      # failure or an outage all return the deterministic text, so the floor is
      # exactly the previous behaviour. Costs one Haiku call per food turn.
      # FOOD_COMPOSER=false reverts without a deploy.
      - key: FOOD_COMPOSER
        value: "true"
      # DEFER MICRONUTRIENTS OFF THE REPLY PATH (P1 latency).
      #
      # The card's primary numbers (cal/protein/carbs/fats) resolve inline and
      # are shown immediately; the micro panel (fiber/sugar/sodium/vitamins) is
      # a per-item Haiku call that was blocking the serial reply path for ~0.6-1s
      # per branded/composite item. `_deferred_micro_fill` populates them on its
      # OWN session via ensure_future right after the reply is sent, so the panel
      # fills a beat later instead of holding the whole turn. FOOD_MICROS_DEFERRED
      # =false reverts to inline without a deploy.
      - key: FOOD_MICROS_DEFERRED
        value: "true"
      # SECOND-TIER HEADS-UP (P1 felt-latency) — OFF. When a food turn was still
      # running ~6s in this appended a fuller "still on it, here's what's taking
      # the time" line after the first heads-up. Pure reassurance; it never
      # touched the log.
      #
      # TURNED OFF 2026-08-03 (Danny): it collides with the answer. The timer
      # emits through `on_text_bubble` directly, outside the bubble streamer's
      # ordering, so a reply that lands while the line is in flight interleaves
      # with it — and its `_reply_ready` guard cannot close that window, because
      # the flag flips at commit while the composer's bubbles are still
      # streaming behind it. The shipped shape was two heads-up lines about the
      # same food ("let me get the proper numbers for that tuna sashimi", then
      # "taking a closer look at that tuna sashimi") stacked above the answer,
      # which reads as the coach repeating himself rather than as reassurance.
      # The first-tier heads-up at ~2.5s stays; it is inside the streamer.
      # Set back to "true" to restore, no code change needed.
      - key: FOOD_LATE_HEADSUP
        value: "false"
      - key: FOOD_LATE_HEADSUP_DELAY_S
        value: "3.5"
      # THE FAST PATH, MEASURED BUT NOT TRUSTED.
      #
      # `core/food_fast_path.py` is a deterministic parser that produces the
      # same interpreter-shaped dict for messages with provably one reading
      # ("150g chicken breast", "2 eggs and 200g rice") and None for
      # everything else. For the turns it accepts, the interpreter — the
      # largest block in a food turn, around four seconds — does not run at
      # all. It has been complete and switched off, with nothing measuring it
      # either, so the accept rate on real traffic is unknown.
      #
      # SHADOW ONLY. It parses, logs `event=food_fast_path_shadow agree=…`
      # against what the model went on to decide, and acts on none of it.
      # No behaviour changes; this exists so the decision to trust it with a
      # write is made on this user's own traffic rather than on a sample
      # somebody chose. FOOD_FAST_PATH stays absent — that is the switch that
      # would let it write, and it should not be thrown until the agreement
      # rate says so.
      - key: FOOD_FAST_PATH_SHADOW
        value: "on"
      # THE FOOD GATE IS THE CLASSIFIER, NOT FOUR ENGLISH REGEXES.
      #
      # Everything downstream of this gate — staged items, the mode-aware ask
      # ladder, the composer above, partial commit — is unreachable for any
      # message it turns away, and it was turning away nearly all of them.
      # Measured on this build with the flags unset:
      #
      #   "Oh and a bag of quest chips"   legacy, no_food_shape
      #   "a scoop of peanut butter"      legacy, no_food_shape
      #   "two carnitas tacos"            legacy, no_food_shape
      #   "cottage cheese"                legacy, no_food_shape
      #   "chicken and rice"              legacy, no_food_shape
      #
      # 2 of 10 realistic food messages reached the lane. `applies()` agrees:
      # its own docstring records 64% missed over 1008 production messages.
      # So the clarification work shipped and then sat dark, because the
      # switch in front of it was never thrown.
      #
      # This is `applies()` first and a Haiku call ONLY for what it misses, so
      # the cost is bounded by the gate's own miss rate rather than by traffic.
      # On any model failure or outage `food_relevance` returns `applies(t)` —
      # the floor is exactly the behaviour above, which is why this is safe to
      # turn on before the precision work lands rather than after.
      #
      # NOT set alongside FOOD_GATE_OPEN. Open makes `applies()` admit on
      # absence of evidence, which short-circuits before the model ever runs
      # and gives up the precision this buys. They are alternatives.
      # FOOD_GATE_MODEL=false reverts without a deploy.
      - key: FOOD_GATE_MODEL
        value: "true"

      # ⛔⛔⛔ SHAPE C — the report-only `extras` permission class.
      # REJECTED. Not "disabled", not "not yet enabled" — FALSIFIED, and the
      # falsification is the reason the flag still exists.
      #
      #   REJECTED by arms E1/E2/E3 at `83342c6`, 150 turns, every
      #   preregistered refusal condition clear:
      #     C off  22/50 and 23/50     C ON  30/50
      #     null envelope 1            effect +7.5   OUTSIDE it, as HARM
      #
      # C does not reduce asking. It INCREASES it by 15 points, broad across 8
      # of 25 cases. Its earlier apparent benefit was NOT partly a measurement
      # artifact — the artifact WAS the benefit, and it was masking an effect
      # of the opposite sign. There is no second beneficial mechanism to find.
      #
      # ⭐ WHY THE BRANCH IS RETAINED RATHER THAN DELETED: "extras should just
      # be report-only" is an attractive idea that will be rediscovered. Kept
      # as a RUNNABLE historical causal arm, anyone who reaches for it meets
      # the falsification and can re-run it in one command. Kept as a comment
      # alone, they would have to repeat the 150 turns to learn what is already
      # known.
      #
      # Guarded by tests/test_a_rejected_arm_cannot_drift_back_on.py, which
      # pins BOTH directions: it cannot drift on by accident, and it must still
      # actually work when deliberately switched on — a historical arm that no
      # longer runs is not a historical arm, it is dead code.
      #
      # ⚠ IF THIS EVER BECOMES A MAINTENANCE BURDEN: delete the executable
      # branch and keep the experiment in data/criteria_registry.json
      # (`shape_c_unstated_extras_report_only_field`). The experiment is what
      # has value. Permanent dead production code does not.
      - key: FOOD_EXTRAS_REPORT_ONLY
        value: "false"

      - key: ARNIE_USERS_DIR
        value: /data/users
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Required for ALL voice features: Whisper transcription of inbound voice
      # notes AND tts-1 for spoken replies. Secret — set the value in the Render
      # dashboard. Without it, voice notes fail to transcribe and no audio is sent.
      - key: OPENAI_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: claude-sonnet-4-6
      - key: WHOOP_CLIENT_ID
        sync: false
      - key: WHOOP_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: BLUEBUBBLES_URL
        sync: false
      - key: BLUEBUBBLES_PASSWORD
        sync: false
      - key: BLUEBUBBLES_WEBHOOK_SECRET
        sync: false
      # ── Security (B7, 2026-07-31). This file is reference-only for this
      # service — the Render DASHBOARD value is what actually applies (see the
      # NUTRITION_RESOLVER_MODE incident). Set these in the dashboard.
      #
      # Signs native-app session tokens AND the admin dashboard cookie. If unset,
      # auth.py falls back to a PUBLIC hardcoded dev secret — every token becomes
      # forgeable. Must be a strong random value in prod.
      - key: SESSION_SECRET
        sync: false
      # Secure-by-default sign-in. When true, provider="device" mints a session
      # for ANY identity string with no credential (dev only). MUST be false in
      # prod, where only verified Apple sign-in may mint a session.
      - key: DEV_AUTH_ENABLED
        value: "false"
      # Optional second factor on the Telegram webhook: when set, Telegram echoes
      # it in X-Telegram-Bot-Api-Secret-Token and the endpoint enforces it, so a
      # leaked in-URL bot token alone can't forge updates. main.py registers it.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Render terminates TLS at its proxy, so the app's peer IP is the proxy and
      # every caller shares it. With this true, the rate limiter reads the real
      # client from X-Forwarded-For. Safe ONLY behind a trusted proxy (Render is).
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: SENTRY_DSN
        sync: false
      - key: USDA_API_KEY
        sync: false
      - key: LINKING_ENABLED
        value: "true"
      # Master switch for the Brain tab (live mindmap of learned facts). When unset,
      # the dashboard hides the Brain nav/panel and /brain/{token} + /api/brain/insights
      # return 404 by design. Set to "true"/"1" in the Render dashboard to expose it
      # (this file is reference-only, so the dashboard value is what actually applies).
      - key: BRAIN_TAB_ENABLED
        value: "true"
      - key: ARNIE_IMESSAGE_ADDRESS
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: "Arnie_1026_Bot"
      # Global master switch for proactive check-ins. Per-user check-ins are enabled
      # natively at onboarding completion, but NOTHING sends until this is "true".
      # Set it to "true" in the Render dashboard to go live (this file is reference-only).
      - key: PROACTIVE_MESSAGING_ENABLED
        value: "true"
      # Reply to an inbound voice note with a spoken (TTS) voice note, in addition
      # to the text reply. Telegram only; requires OPENAI_API_KEY. Flip to "true"
      # in the Render dashboard to go live (this file is reference-only).
      - key: VOICE_REPLIES_ENABLED
        value: "false"
      # Branded base for user-facing dashboard links (separate from RENDER_EXTERNAL_URL,
      # which webhooks/OAuth keep using). SET THIS ONLY AFTER app.tryarnie.com is added
      # as a custom domain on this service and DNS resolves — until then leave it unset
      # and links safely fall back to the service's own host.
      - key: DASHBOARD_BASE_URL
        value: "https://app.tryarnie.com"

databases:
  # Render-managed Postgres. Replaces the SQLite-on-disk DB (AUDIT #5). Fresh start:
  # no data is migrated from the old SQLite file (it stays on the disk as a fallback).
  # The arnie-bot service reads its connection string via DATABASE_URL fromDatabase.
  - name: arnie-db
    databaseName: arnie
    plan: basic-256mb
